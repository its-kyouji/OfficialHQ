# ==============================
# ENVOY PROXY CONFIGURATION
# ==============================

# ==== ADMIN INTERFACE ====
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

# ==== LISTENER & HTTP CONNECTION MANAGER ====
static_resources:
  listeners:
  - name: listener_0
    address:
      # !! PORT BINDING: Handles Cloud Run $PORT !!
      socket_address: { address: 0.0.0.0, port_value: 8081 }

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          stream_idle_timeout: 0s

          # ==== ACCESS LOGGING ====
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format: "[ENVOY] %START_TIME% | %REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% | %PROTOCOL% | RESP:%RESPONSE_CODE% | FLAGS:%RESPONSE_FLAGS% | DETAILS:%RESPONSE_CODE_DETAILS% | UPSTREAM:%UPSTREAM_HOST%\n"

          # ==== ROUTING CONFIGURATION ====
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  path: "/health"
                direct_response:
                  status: 200
                  body:
                    inline_string: "OK"

              - match:
                  prefix: "/"
                route:
                  # !! NEXT HOP: Forwards traffic to HAProxy !!
                  cluster: haproxy_cluster
                  timeout: 0s
                  idle_timeout: 0s

          # ==== HTTP FILTERS & PROTOCOL UPGRADES ====
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

          upgrade_configs:
          - upgrade_type: websocket
          - upgrade_type: http/1.1

# ==== BACKEND CLUSTERS ====
  clusters:
  - name: haproxy_cluster
    connect_timeout: 1s
    type: STATIC

    load_assignment:
      cluster_name: haproxy_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              # !! BACKEND TARGET: HAProxy listener !!
              socket_address: { address: 127.0.0.1, port_value: 8082 }

    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        use_downstream_protocol_config:
          http2_protocol_options: {}

    # ==== CIRCUIT BREAKER SETTINGS ====
    circuit_breakers:
      thresholds:
      - priority: DEFAULT
        max_connections: 4096
        max_pending_requests: 1024
        max_requests: 4096
        max_retries: 3

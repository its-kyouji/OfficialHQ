global
    maxconn 4096

defaults
    mode http
    log stdout format raw local0
    option httplog
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

# ==== PUBLIC FRONTEND ====
frontend public_in
    bind 127.0.0.1:8082

    # ==== UI & HEALTH ROUTES ====
    acl is_health path /health
    acl is_ui path / /runtime.json
    acl is_ui path_beg /sub /vault

    # ==== BASE PATH VALIDATION ====
    acl is_base_path path_beg __BASE_PATH__/

    # ==== DEFAULT ACCESS CONTROL ====
    http-request deny deny_status 404 if !is_health !is_ui !is_base_path

    # ==== UI ROUTING ====
    use_backend ui_backend if is_health || is_ui

    # ==== XHTTP ROUTING ====
    acl is_xhttp path_reg ^__BASE_PATH__/x/.*-xh(/.*)?$
    use_backend caddy_xhttp if is_xhttp

    # ==== SSH DROPBEAR ROUTING ====
    acl is_ssh_drop path_reg ^__BASE_PATH__/drop-(ws|hu|xh)$
    use_backend bridge_dropbear if is_ssh_drop

    # ==== SSH OPENSSH ROUTING ====
    acl is_ssh_open path_reg ^__BASE_PATH__/open-(ws|hu|xh)$
    use_backend bridge_openssh if is_ssh_open

    # ==== OPENVPN ROUTING ====
    acl is_ovpn path_reg ^__BASE_PATH__/ovpn-(ws|hu)$
    use_backend bridge_ovpn if is_ovpn

    # ==== CORE WS & HTTP UPGRADE ROUTING ====
    acl is_ws_hu path_reg ^__BASE_PATH__/[xs]/[a-z]+-(ws|hu)$
    use_backend nginx_ws_hu if is_ws_hu

    # ==== XRAY GRPC ROUTING ====
    acl is_xray_vless_grpc path_reg ^__BASE_PATH__/x/vless-grpc(/(Tun|TunMulti))?$
    use_backend xray_vless_grpc if is_xray_vless_grpc

    acl is_xray_vmess_grpc path_reg ^__BASE_PATH__/x/vmess-grpc(/(Tun|TunMulti))?$
    use_backend xray_vmess_grpc if is_xray_vmess_grpc

    acl is_xray_trojan_grpc path_reg ^__BASE_PATH__/x/trojan-grpc(/(Tun|TunMulti))?$
    use_backend xray_trojan_grpc if is_xray_trojan_grpc

    acl is_xray_ss_grpc path_reg ^__BASE_PATH__/x/ss-grpc(/(Tun|TunMulti))?$
    use_backend xray_ss_grpc if is_xray_ss_grpc

    # ==== SING-BOX GRPC ROUTING ====
    acl is_sing_vless_grpc path_reg ^__BASE_PATH__/s/vless-grpc(/(Tun|TunMulti))?$
    use_backend sing_vless_grpc if is_sing_vless_grpc

    acl is_sing_vmess_grpc path_reg ^__BASE_PATH__/s/vmess-grpc(/(Tun|TunMulti))?$
    use_backend sing_vmess_grpc if is_sing_vmess_grpc

    acl is_sing_trojan_grpc path_reg ^__BASE_PATH__/s/trojan-grpc(/(Tun|TunMulti))?$
    use_backend sing_trojan_grpc if is_sing_trojan_grpc

# ==== CONTAINER BACKENDS ====
backend ui_backend
    server nginx_ui 127.0.0.1:8083

backend caddy_xhttp
    server caddy 127.0.0.1:8084

backend nginx_ws_hu
    server nginx 127.0.0.1:8083

backend bridge_dropbear
    server dropbear_bridge 127.0.0.1:2222

backend bridge_openssh
    server openssh_bridge 127.0.0.1:2223

backend bridge_ovpn
    server ovpn_bridge 127.0.0.1:2224

# ==== XRAY GRPC BACKENDS ====
backend xray_vless_grpc
    server grpc_backend 127.0.0.1:10004 proto h2

backend xray_vmess_grpc
    server grpc_backend 127.0.0.1:10008 proto h2

backend xray_trojan_grpc
    server grpc_backend 127.0.0.1:10012 proto h2

backend xray_ss_grpc
    server grpc_backend 127.0.0.1:10016 proto h2

# ==== SING-BOX GRPC BACKENDS ====
backend sing_vless_grpc
    server grpc_backend 127.0.0.1:11003 proto h2

backend sing_vmess_grpc
    server grpc_backend 127.0.0.1:11006 proto h2

backend sing_trojan_grpc
    server grpc_backend 127.0.0.1:11009 proto h2

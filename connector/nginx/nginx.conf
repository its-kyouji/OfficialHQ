# === NGINX MAIN ===
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr info;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8083;
        server_name _;

        include /run/cfg/connector/nginx/routes/health-ui.conf;
        include /run/cfg/connector/nginx/routes/xray.conf;
        include /run/cfg/connector/nginx/routes/singbox.conf;
    }
}
